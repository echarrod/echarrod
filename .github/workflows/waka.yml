name: Waka Readme

on:
  schedule:
    # Runs at 10:30pm UTC; GitHub often starts scheduled runs hours late
    - cron: '30 22 * * *'
    
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: anmol098/waka-readme-stats@master
        continue-on-error: false
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_OS: False
          COMMIT_MESSAGE: "waka: Update dev metrics"
          SHOW_UPDATED_DATE: True
          SHOW_PROFILE_VIEWS: False
          SHOW_PROJECTS: False
          SHOW_SHORT_INFO: False
          SHOW_DAYS_OF_WEEK: False
          # LOC + commit-time stats rescan every branch of every repo (>3h); off until
          # upstream can scan default branches only: anmol098/waka-readme-stats#702
          SHOW_LINES_OF_CODE: False
          SHOW_LOC_CHART: False
          SHOW_COMMIT: False
          SHOW_TOTAL_CODE_TIME: False
          SHOW_LANGUAGE_PER_REPO: False
          # Stale upstream forks: 919 of ~2,500 branches the LOC scan walks, almost none Ed's
          IGNORED_REPOS: paperclip,gemini-cli
